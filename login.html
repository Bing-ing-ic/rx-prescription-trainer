<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 处方推演训练平台</title>
<style>
  :root{
    --blue-deep:#0f4c81; --blue-mid:#1a6fb5; --blue-light:#2c7be5;
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#eef4fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(44,123,229,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(15,76,129,.15), transparent 60%),
      var(--bg);
    padding:20px;
  }
  .login-card{
    width:100%; max-width:400px; background:rgba(255,255,255,.75);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:20px; overflow:hidden;
    box-shadow:0 20px 60px rgba(15,76,129,.18), 0 2px 8px rgba(15,76,129,.08);
  }
  .login-head{
    background:linear-gradient(135deg,#0a1628 0%,#0f4c81 55%,#1a6fb5 100%);
    color:#fff; padding:34px 32px 28px; text-align:center; position:relative; overflow:hidden;
  }
  .login-head::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg,#38bdf8,#fff,#38bdf8); opacity:.6;
  }
  .logo-badge{
    width:64px; height:64px; margin:0 auto 14px; border-radius:50%;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    font-size:32px; box-shadow:inset 0 2px 8px rgba(255,255,255,.25), 0 6px 18px rgba(0,0,0,.2);
  }
  .login-head h1{font-size:20px; font-weight:700; letter-spacing:1px;}
  .login-head p{font-size:12px; opacity:.75; margin-top:6px;}
  .login-body{padding:30px 32px 28px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:7px; font-weight:600;}
  .input-wrap{position:relative;}
  .input-wrap input{
    width:100%; padding:12px 44px 12px 14px; font-size:15px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:12px; background:#fff; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .input-wrap input:focus{border-color:var(--blue-mid); box-shadow:0 0 0 4px rgba(26,111,181,.12);}
  .toggle-pwd{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:16px; color:var(--muted); padding:4px;
  }
  .error-msg{
    display:none; font-size:13px; color:#dc2626; background:#fef2f2;
    border:1px solid #fecaca; border-radius:10px; padding:9px 12px; margin-bottom:16px;
  }
  .error-msg.show{display:block; animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);}
    50%{transform:translateX(6px);} 75%{transform:translateX(-3px);}
  }
  .btn-login{
    width:100%; padding:13px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg,var(--blue-deep),var(--blue-light));
    color:#fff; font-size:16px; font-weight:700; letter-spacing:2px;
    box-shadow:0 8px 20px rgba(26,111,181,.35); transition:transform .15s, box-shadow .15s;
  }
  .btn-login:hover{transform:translateY(-1px); box-shadow:0 10px 24px rgba(26,111,181,.45);}
  .btn-login:active{transform:translateY(0);}
  .login-foot{
    text-align:center; padding:0 32px 26px; font-size:12px; color:var(--muted);
  }
  .login-foot a{color:var(--blue-mid); text-decoration:none;}
  .login-foot a:hover{text-decoration:underline;}
  .guard{margin-top:14px; font-size:11px; color:#94a3b8;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-head">
      <div class="logo-badge">⚕</div>
      <h1>管理员控制台</h1>
      <p>医学生处方推演训练平台 · Admin Access</p>
    </div>
    <div class="login-body">
      <div class="error-msg" id="err">❌ 密码错误，请重新输入（默认密码 admin123）</div>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label>管理员账号</label>
          <div class="input-wrap">
            <input type="text" id="username" value="admin" readonly style="background:#f1f5f9;color:#64748b;">
          </div>
        </div>
        <div class="field">
          <label>访问密码</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="请输入管理员密码" autofocus>
            <button type="button" class="toggle-pwd" id="toggleBtn" title="显示/隐藏">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-login">进 入 控 制 台</button>
      </form>
    </div>
    <div class="login-foot">
      <a href="index.html">← 返回训练平台首页</a>
      <div class="guard">🔒 本入口为客户端轻量校验，仅用于隔离后台视图</div>
    </div>
  </div>

<script>
(function(){
  // 已登录则直接进控制台
  try{
    if(sessionStorage.getItem('rx-admin-auth')==='1'){ location.replace('admin.html'); return; }
  }catch(e){}

  // 轻量 SHA-256（crypto.subtle 不可用时降级为 djb2 字符串散列）
  async function hashStr(s){
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rx-admin::'+s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    let h = 5381;
    for(let i=0;i<s.length;i++){ h = ((h<<5)+h+s.charCodeAt(i))|0; }
    return 'djb2::'+(h>>>0);
  }

  const form = document.getElementById('loginForm');
  const pwd = document.getElementById('password');
  const err = document.getElementById('err');

  document.getElementById('toggleBtn').addEventListener('click', function(){
    pwd.type = pwd.type==='password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const input = pwd.value;
    // 已设置过自定义密码则用自定义，否则用默认 admin123
    let expected;
    try{ expected = localStorage.getItem('rx-admin-pwd-hash'); }catch(e){}
    if(!expected){ expected = await hashStr('admin123'); }
    const inputHash = await hashStr(input);
    if(inputHash === expected){
      try{
        sessionStorage.setItem('rx-admin-auth','1');
        sessionStorage.setItem('rx-admin-time', String(Date.now()));
      }catch(e){}
      location.replace('admin.html');
    }else{
      err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
      pwd.value=''; pwd.focus();
    }
  });
})();
</script>
</body>
</html>
